<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 510" role="img" aria-labelledby="title desc">
<title id="title">De tres fases temporales a una probabilidad de pCR</title><desc id="desc">Una red: entrada normalizada, cuatro bloques convolucionales con 16, 32, 64 y 128 canales, promedio espacial, capa densa de 64 y salida sigmoid. El predictor final promedia las probabilidades de cinco redes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#759b90" stroke-width="1.5"/></marker></defs>
